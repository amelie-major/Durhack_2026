[project]
name = "fxfm"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
